<form [formGroup]="form" (ngSubmit)="submit()">
    <div dir="rtl" class="row p-4">
        <div class="col-6">
            <input (keypress)="numberOnly($event)" type="text" formControlName="nationalId"
                placeholder="ادخل الرقم القومي هنا ...." pInputText class="w-100">
        </div>
        <div class="col-2">
            <p-button label="بحث" class="" type="submit" [disabled]="form.invalid"></p-button>
        </div>
        <!-- <p-inputNumber inputId="integeronly" (keypress)="numberOnly($event)" type="text" formControlName="nationalId"
            placeholder="ادخل الرقم القومي هنا ...." class="w-75 mb-5">
        </p-inputNumber> -->
        <!-- <small class="text-danger" *ngIf="form.get('nationalId')?.errors?.['required']">National ID is required.</small>
        <small class="text-danger" *ngIf="form.get('nationalId')?.errors?.['pattern']">Invalid National ID format.</small> -->
    </div>
</form>

<div class="p-3 text-center ">
    <p-table [value]="patients.history">
        <ng-template pTemplate="header">
            <tr>
                <th>التاريخ</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr>
                <td>{{product | date:('DD-mm-yyyy , HH:mm a') }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
